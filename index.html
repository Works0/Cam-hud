<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COREX//SYNC Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            user-select: none;
        }
        body {
            background-color: #14171a;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding-bottom: 20px;
        }
        .container {
            width: 160%;
            max-width: 850px;
            background: #14171a;
            border: 1px solid #2a2e35;
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            height: 85px;
            background: #0d0f11;
        }
        .tab {
            flex: 1;
            position: relative;
            background: #1a1e23;
            color: #b0b8c4;
            font-size: 25px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-right: 1px solid #0d0f11;
            transition: background 0.2s, color 0.2s;
        }
        .tab:hover {
            background: #252a32;
            color: #ffffff;
        }
        .tab.active {
            background: #ff6600;
            color: #ffffff;
        }
        .panel {
            display: none;
            padding: 12px 10px;
            background: #181c21;
            min-height: 320px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel.active {
            display: flex !important;
        }
        .sub-btn {
            background: #22272e;
            border: 1px solid #363d47;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 28px;
            font-weight: bold;
            color: #e0e0e0;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .sub-btn:hover {
            background: #2c333d;
            border-color: #ff6600;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Target</div>
            <div class="tab" onclick="switchTab(1)">Quiet</div>
            <div class="tab" onclick="switchTab(2)">Zoom</div>
            <div class="tab" onclick="switchTab(3)">Angles</div>
            <div class="tab" onclick="switchTab(4)">Orbits 1</div>
            <div class="tab" onclick="switchTab(5)">Orbits 2</div>
        </div>

        <!-- Panel 0: Target -->
        <div class="panel active" id="panel-0">
            <button class="sub-btn">Scan / Lock Target</button>
            <button class="sub-btn">Reset to Self</button>
            <button class="sub-btn">Recenter View</button>
            <button class="sub-btn">Reset All</button>
        </div>

        <!-- Panel 1: Quiet -->
        <div class="panel" id="panel-1">
            <button class="sub-btn">Hide Tags</button>
            <button class="sub-btn">Show Tags</button>
            <button class="sub-btn">Mute Chat</button>
            <button class="sub-btn">Restore Chat</button>
        </div>

        <!-- Panel 2: Zoom -->
        <div class="panel" id="panel-2">
            <button class="sub-btn">Zoom In 1</button>
            <button class="sub-btn">Zoom Out 1</button>
            <button class="sub-btn">Zoom In 2</button>
            <button class="sub-btn">Zoom Out 2</button>
            <button class="sub-btn">Reset Zoom</button>
        </div>

        <!-- Panel 3: Shot Angles -->
        <div class="panel" id="panel-3">
            <button class="sub-btn">Standard</button>
            <button class="sub-btn">Ed. Low</button>
            <button class="sub-btn">Left Low</button>
            <button class="sub-btn">Right Low</button>
            <button class="sub-btn">Ed. Front</button>
            <button class="sub-btn">Portrait 2</button>
            <button class="sub-btn">Eye Level</button>
            <button class="sub-btn">Play Tour</button>
        </div>

        <!-- Panel 4: Orbits Page 1 -->
        <div class="panel" id="panel-4">
            <button class="sub-btn">Orbit</button>
            <button class="sub-btn">Zoom Out</button>
            <button class="sub-btn">Crane</button>
            <button class="sub-btn">Vertical Arc</button>
            <button class="sub-btn">Zolly</button>
            <button class="sub-btn">Close Zolly</button>
            <button class="sub-btn">Pause / Resume</button>
        </div>

        <!-- Panel 5: Orbits Page 2 -->
        <div class="panel" id="panel-5">
            <button class="sub-btn">Close Orbit</button>
            <button class="sub-btn">Figure 8-1</button>
            <button class="sub-btn">Figure 8-2</button>
            <button class="sub-btn">Helix</button>
            <button class="sub-btn">Dutch Sweep</button>
            <button class="sub-btn">Dutch Tilt</button>
            <button class="sub-btn">Spiral 1</button>
            <button class="sub-btn">Spiral 2</button>
            <button class="sub-btn">Parallax</button>
        </div>
    </div>

    <script>
        function switchTab(index) {
            var tabs = document.querySelectorAll('.tab');
            tabs.forEach(function(tab, i) {
                if(i === index) tab.classList.add('active');
                else tab.classList.remove('active');
            });

            var panels = document.querySelectorAll('.panel');
            panels.forEach(function(panel, i) {
                if(i === index) {
                    panel.classList.add('active');
                    panel.style.display = 'flex';
                } else {
                    panel.classList.remove('active');
                    panel.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
