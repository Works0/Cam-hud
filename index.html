<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COREX//SYNC Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            user-select: none;
        }
        body {
            background-color: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding-bottom: 20px;
        }
        .container {
            width: 160%;
            max-width: 800px;
            background: #f0f2f5;
            border: 1px solid #d0d4dc;
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            height: 85px;
            background: #1a1d20;
        }
        .tab {
            flex: 1;
            position: relative;
            background: #222629;
            color: #b0b8c4;
            font-size: 30px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-right: 1px solid #121416;
            transition: background 0.2s, color 0.2s;
        }
        .tab:hover {
            background: #2c3238;
            color: #ffffff;
        }
        .tab.active {
            background: #ff6600;
            color: #ffffff;
        }
        .panel {
            display: none;
            padding: 12px 10px;
            background: #ffffff;
            min-height: 300px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel.active {
            display: flex !important;
        }
        .sub-btn {
            background: #f5f6f8;
            border: 1px solid #ccd1dc;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 23px;
            font-weight: bold;
            color: #222;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, border-color 0.2s;
        }
        .sub-btn:hover {
            background: #e4e8f0;
            border-color: #ff6600;
            color: #ff6600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Target</div>
            <div class="tab" onclick="switchTab(1)">Quiet</div>
            <div class="tab" onclick="switchTab(2)">Zoom</div>
            <div class="tab" onclick="switchTab(3)">Angles</div>
            <div class="tab" onclick="switchTab(4)">Orbits 1</div>
            <div class="tab" onclick="switchTab(5)">Orbits 2</div>
        </div>

        <!-- Panel 0: Target -->
        <div class="panel active" id="panel-0">
            <button class="sub-btn" onclick="triggerAction('Target Mode')">Scan / Lock Target</button>
            <button class="sub-btn" onclick="triggerAction('Reset to Self')">Reset to Self</button>
            <button class="sub-btn" onclick="triggerAction('Recenter View')">Recenter View</button>
            <button class="sub-btn" onclick="triggerAction('RESET ALL')">Reset All</button>
        </div>

        <!-- Panel 1: Quiet -->
        <div class="panel" id="panel-1">
            <button class="sub-btn" onclick="triggerAction('Hide Tags')">Hide Tags</button>
            <button class="sub-btn" onclick="triggerAction('Show Tags')">Show Tags</button>
            <button class="sub-btn" onclick="triggerAction('Mute Chat')">Mute Chat</button>
            <button class="sub-btn" onclick="triggerAction('Restore Chat')">Restore Chat</button>
        </div>

        <!-- Panel 2: Zoom -->
        <div class="panel" id="panel-2">
            <button class="sub-btn" onclick="triggerAction('Slow Zoom In')">Zoom In 1</button>
            <button class="sub-btn" onclick="triggerAction('Slow Zoom Out')">Zoom Out 1</button>
            <button class="sub-btn" onclick="triggerAction('Zoom 2 In')">Zoom In 2</button>
            <button class="sub-btn" onclick="triggerAction('Zoom 2 Out')">Zoom Out 2</button>
            <button class="sub-btn" onclick="triggerAction('Reset Zoom')">Reset Zoom</button>
        </div>

        <!-- Panel 3: Shot Angles -->
        <div class="panel" id="panel-3">
            <button class="sub-btn" onclick="triggerAction('Standard View')">Standard</button>
            <button class="sub-btn" onclick="triggerAction('Editorial Low')">Ed. Low</button>
            <button class="sub-btn" onclick="triggerAction('Left Low')">Left Low</button>
            <button class="sub-btn" onclick="triggerAction('Right Low')">Right Low</button>
            <button class="sub-btn" onclick="triggerAction('Editorial Front')">Ed. Front</button>
            <button class="sub-btn" onclick="triggerAction('Portrait 2')">Portrait 2</button>
            <button class="sub-btn" onclick="triggerAction('Eye Level')">Eye Level</button>
            <button class="sub-btn" onclick="triggerAction('Play Tour')">Play Tour</button>
        </div>

        <!-- Panel 4: Orbits Page 1 -->
        <div class="panel" id="panel-4">
            <button class="sub-btn" onclick="triggerAction('Orbit')">Orbit</button>
            <button class="sub-btn" onclick="triggerAction('Zoom Out')">Zoom Out</button>
            <button class="sub-btn" onclick="triggerAction('Crane')">Crane</button>
            <button class="sub-btn" onclick="triggerAction('Vertical Arc')">Vertical Arc</button>
            <button class="sub-btn" onclick="triggerAction('Zolly')">Zolly</button>
            <button class="sub-btn" onclick="triggerAction('Close Zolly')">Close Zolly</button>
            <button class="sub-btn" onclick="triggerAction('Pause')">Pause / Resume</button>
        </div>

        <!-- Panel 5: Orbits Page 2 -->
        <div class="panel" id="panel-5">
            <button class="sub-btn" onclick="triggerAction('Close Orbit')">Close Orbit</button>
            <button class="sub-btn" onclick="triggerAction('Figure 8-1')">Figure 8-1</button>
            <button class="sub-btn" onclick="triggerAction('Figure 8-2')">Figure 8-2</button>
            <button class="sub-btn" onclick="triggerAction('Helix')">Helix</button>
            <button class="sub-btn" onclick="triggerAction('Dutch Sweep')">Dutch Sweep</button>
            <button class="sub-btn" onclick="triggerAction('Dutch Tilt')">Dutch Tilt</button>
            <button class="sub-btn" onclick="triggerAction('Spiral 1')">Spiral 1</button>
            <button class="sub-btn" onclick="triggerAction('Spiral 2')">Spiral 2</button>
            <button class="sub-btn" onclick="triggerAction('Parallax')">Parallax</button>
        </div>
    </div>

    <script>
        function switchTab(index) {
            var tabs = document.querySelectorAll('.tab');
            tabs.forEach(function(tab, i) {
                if(i === index) tab.classList.add('active');
                else tab.classList.remove('active');
            });

            var panels = document.querySelectorAll('.panel');
            panels.forEach(function(panel, i) {
                if(i === index) {
                    panel.classList.add('active');
                    panel.style.display = 'flex';
                } else {
                    panel.classList.remove('active');
                    panel.style.display = 'none';
                }
            });
        }

        function triggerAction(actionName) {
            var img = new Image();
            img.src = "secondlife:///app/agent/00000000-0000-0000-0000-000000000000/im?message=" + encodeURIComponent(actionName);
        }
    </script>

</body>
</html>
